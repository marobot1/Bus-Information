name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"
          test -d "$SDK"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: npm install
        run: npm ci
      - name: Copy web files
        run: npx cap sync android
      - name: Insert keys
        env:
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
          GTTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          F=android/app/src/main/assets/public/index.html
          T=$(printf %s "$TAGO_KEY" | tr -d '\r\n ')
          G=$(printf %s "$GTTS_KEY" | tr -d '\r\n ')
          if [ -n "$T" ]; then sed -i "s|__TAGO_KEY__|$T|" "$F"; echo "TAGO key set"; fi
          if [ -n "$G" ]; then sed -i "s|__GTTS_KEY__|$G|" "$F"; echo "TTS key set"; fi
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/bus-release.keystore; fi
      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk grandma-bus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: grandma-bus-apk
          path: grandma-bus.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Grandma Bus 2.1.${{ github.run_number }}
          files: grandma-bus.apk
          make_latest: true