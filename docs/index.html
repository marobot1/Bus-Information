<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2F62F5"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><style>html,body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style><script>window.BUS_HOSTED=true</script></head><body><title>버스친구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: soft-UI phone app. Two modes (편리 = big type, one thing at a time / 일반 = denser transit-app layout) and light/dark themes.
   Screens: 홈, 읍 가는 버스, 삼천포 가는 버스, 집 가는 버스, 시간표, 알림, 설정. Floating gradient tab bar with raised center button. */
:root{
  color-scheme:light;
  --bg:#E8EDF5; --surface:#FFFFFF; --surface-2:#F3F6FB; --ink:#172033; --muted:#6F7B92; --line:#E1E7F0; --track:#E6EBF3;
  --blue:#2F62F5; --blue-soft:#E6EEFF; --blue-line:#C6D6FF; --link:#2456E8;
  --ok:#0E8752; --ok-soft:#DFF3E8; --warn:#B26200; --warn-soft:#FFEFD5; --late:#D3343B; --late-soft:#FDE3E3;
  --tag:#11998F; --on-tag:#FFFFFF;
  --note-ink:#7A4600; --on-grad:#FFFFFF; --on-grad-dim:rgba(255,255,255,.76);
  --toast:#172033; --on-toast:#FFFFFF; --scrim:rgba(15,22,38,.45);
  --blob1:#D3E1FF; --blob2:#E2DDFF;
  --grad:linear-gradient(140deg,#56ADFF 0%,#2F62F5 72%);
  --shadow:0 16px 32px -14px rgba(34,62,128,.24),0 3px 8px -3px rgba(34,62,128,.08);
  --shadow-sm:0 8px 18px -10px rgba(34,62,128,.28);
  --inset:inset 0 2px 6px rgba(34,62,128,.10);
  --f-num:"Poppins","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1321; --surface:#171F31; --surface-2:#1E283D; --ink:#EDF1F8; --muted:#97A3BA; --line:#283350; --track:#243049;
  --blue:#6B97FF; --blue-soft:#1C2A4F; --blue-line:#34497C; --link:#8EB0FF;
  --ok:#4BD996; --ok-soft:#113524; --warn:#FFB54A; --warn-soft:#382811; --late:#FF7C81; --late-soft:#3E181B;
  --note-ink:#FFD08C; --toast:#EDF1F8; --on-toast:#0D1321; --scrim:rgba(0,0,0,.6);
  --blob1:rgba(54,88,190,.35); --blob2:rgba(96,66,170,.28);
  --grad:linear-gradient(140deg,#4F9EFF 0%,#3561EE 72%);
  --shadow:0 16px 32px -14px rgba(0,0,0,.6),0 3px 8px -3px rgba(0,0,0,.35);
  --shadow-sm:0 8px 18px -10px rgba(0,0,0,.6); --inset:inset 0 2px 6px rgba(0,0,0,.35)}}
:root[data-theme="dark"],:root.t-dark{
  color-scheme:dark;
  --bg:#0D1321; --surface:#171F31; --surface-2:#1E283D; --ink:#EDF1F8; --muted:#97A3BA; --line:#283350; --track:#243049;
  --blue:#6B97FF; --blue-soft:#1C2A4F; --blue-line:#34497C; --link:#8EB0FF;
  --ok:#4BD996; --ok-soft:#113524; --warn:#FFB54A; --warn-soft:#382811; --late:#FF7C81; --late-soft:#3E181B;
  --note-ink:#FFD08C; --toast:#EDF1F8; --on-toast:#0D1321; --scrim:rgba(0,0,0,.6);
  --blob1:rgba(54,88,190,.35); --blob2:rgba(96,66,170,.28);
  --grad:linear-gradient(140deg,#4F9EFF 0%,#3561EE 72%);
  --shadow:0 16px 32px -14px rgba(0,0,0,.6),0 3px 8px -3px rgba(0,0,0,.35);
  --shadow-sm:0 8px 18px -10px rgba(0,0,0,.6); --inset:inset 0 2px 6px rgba(0,0,0,.35)}
:root.t-light{
  color-scheme:light;
  --bg:#E8EDF5; --surface:#FFFFFF; --surface-2:#F3F6FB; --ink:#172033; --muted:#6F7B92; --line:#E1E7F0; --track:#E6EBF3;
  --blue:#2F62F5; --blue-soft:#E6EEFF; --blue-line:#C6D6FF; --link:#2456E8;
  --ok:#0E8752; --ok-soft:#DFF3E8; --warn:#B26200; --warn-soft:#FFEFD5; --late:#D3343B; --late-soft:#FDE3E3;
  --note-ink:#7A4600; --toast:#172033; --on-toast:#FFFFFF; --scrim:rgba(15,22,38,.45);
  --blob1:#D3E1FF; --blob2:#E2DDFF;
  --grad:linear-gradient(140deg,#56ADFF 0%,#2F62F5 72%);
  --shadow:0 16px 32px -14px rgba(34,62,128,.24),0 3px 8px -3px rgba(34,62,128,.08);
  --shadow-sm:0 8px 18px -10px rgba(34,62,128,.28); --inset:inset 0 2px 6px rgba(34,62,128,.10)}

*{box-sizing:border-box}
html{background:var(--bg)}
body{min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:var(--fs,17px);line-height:1.45;-webkit-text-size-adjust:100%;word-break:keep-all;
  background:radial-gradient(560px 380px at 108% -6%,var(--blob1) 0%,transparent 70%),radial-gradient(520px 420px at -18% 104%,var(--blob2) 0%,transparent 70%),var(--bg);
  transition:background-color .3s}
body.m-easy{--fs:18px;--t1:27px;--t2:21px;--ring:224px;--rn:42px}
body.m-normal{--fs:15.5px;--t1:23px;--t2:18px;--ring:132px;--rn:26px}
button,input,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent;color:var(--link)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[data-act]{cursor:pointer}

.app{max-width:500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(130px + env(safe-area-inset-bottom,0px))}
body.alarming .app{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
#main{display:flex;flex-direction:column;gap:16px}
.m-easy #main{gap:18px}
#main.enter>*{animation:rise .42s var(--ease) both}
#main.enter>*:nth-child(2){animation-delay:.04s}#main.enter>*:nth-child(3){animation-delay:.08s}#main.enter>*:nth-child(4){animation-delay:.12s}#main.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:.25;transform:translateY(12px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.m-easy .card{border-radius:26px;padding:20px}
.sec{font-size:var(--t2);font-weight:900;margin:4px 2px -4px;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-h h2{margin:0;font-size:calc(var(--t2) - 2px);font-weight:900}
.card-h span,.card-h button.lnk{font-size:13.5px;color:var(--muted);font-weight:700;text-align:right}
.lnk{appearance:none;border:0;background:none;padding:6px 0;color:var(--link)!important;font-weight:800!important}
.hint{font-size:14.5px;color:var(--muted);font-weight:500;margin:0;line-height:1.5}

/* top */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 2px 0}
.hello{margin:0;color:var(--muted);font-size:15px;font-weight:600}
.today{margin:2px 0 0;font-size:var(--t1);font-weight:900;letter-spacing:-.02em;line-height:1.2}
.clock{flex:none;background:var(--surface);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm);font-weight:700;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.clock .num{font-weight:600}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}80%,100%{box-shadow:0 0 0 7px transparent}}

/* brand */
.brand{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.brand img{width:30px;height:31px;border-radius:9px;box-shadow:var(--shadow-sm)}
.brand b{font-size:15px;font-weight:900;letter-spacing:-.01em}
.sheet-logo{width:64px;height:66px;border-radius:18px;box-shadow:var(--shadow)}

/* 정류장 보드 (카카오맵 정류장 화면처럼) */
.sb-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sb-h h2{margin:0;font-size:calc(var(--t2) + 3px);font-weight:900;letter-spacing:-.02em}
.sb-h p{margin:3px 0 0;color:var(--muted);font-size:14.5px;font-weight:600}
.iconbtn.sm{width:40px;height:40px;border-radius:13px}
.iconbtn.sm svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sb-sec{display:flex;align-items:baseline;gap:4px 8px;margin:16px 0 0;font-size:15.5px;font-weight:900;flex-wrap:wrap;white-space:nowrap}
.sb-sec span{font-size:12.5px;color:var(--muted);font-weight:600}
.sb-list{list-style:none;margin:4px 0 0;padding:0}
.sb-list li{border-top:1px solid var(--line)}
.sb-list li:first-child{border-top:0}
.sb-row{appearance:none;border:0;background:none;width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 0;transition:transform .18s var(--ease)}
.sb-row:active{transform:scale(.98)}
.sb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb-tag{font-size:12px;font-weight:900;color:var(--on-tag);background:var(--tag);border-radius:7px;padding:2px 7px;line-height:1.5}
.sb-no{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1.1}
.sb-dir{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:3px}
.sb-r{text-align:right;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-t1{font-size:17px;font-weight:800}
.sb-t1.live{color:var(--late)}
.sb-t1 small,.sb-t2 small{font-size:.82em;font-weight:700}
.sb-t2{font-size:14px;color:var(--muted);font-weight:700}
.m-easy .sb-no{font-size:27px}
.m-easy .sb-t1{font-size:19px}

/* tiles (easy) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{appearance:none;border:0;text-align:left;min-height:178px;border-radius:26px;padding:18px 16px 16px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .18s var(--ease)}
.tile:active,.qa:active,.btn:active,.pill:active,.row:not(.static):active{transform:scale(.97)}
.tile-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);margin-bottom:8px}
.tile-ic svg{width:27px;height:27px}
.tile-t{font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.tile-s{font-size:14px;color:var(--muted);font-weight:600}
.tile-n{margin-top:auto;padding-top:8px;font-size:16px;font-weight:800;color:var(--blue);line-height:1.3}
.tile-n em{display:block;font-style:normal;font-size:14px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.tile--hi{background:var(--grad);color:var(--on-grad);box-shadow:0 18px 30px -14px rgba(47,98,245,.6)}
.tile--hi .tile-ic{background:rgba(255,255,255,.22);color:var(--on-grad)}
.tile--hi .tile-s{color:var(--on-grad-dim)}
.tile--hi .tile-n{color:var(--on-grad)}

/* quick actions (normal) */
.qas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{appearance:none;border:0;border-radius:20px;padding:14px 12px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;transition:transform .18s var(--ease)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.qa .ic svg{width:22px;height:22px}
.qa b{font-size:15px;font-weight:900;line-height:1.25}
.qa span{font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.qa--hi{background:var(--grad);color:var(--on-grad)}
.qa--hi .ic{background:rgba(255,255,255,.22);color:var(--on-grad)}
.qa--hi span{color:var(--on-grad-dim)}

/* rows */
.deps{list-style:none;margin:0;padding:0}
.deps li{border-top:1px solid var(--line)}
.deps li:first-child{border-top:0}
.row{appearance:none;border:0;background:none;width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 0;transition:transform .18s var(--ease)}
.row.static{cursor:default}
.dt{font-size:22px;font-weight:600;line-height:1}
.m-easy .dt{font-size:24px}
.dt small{font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--muted);margin-right:4px;vertical-align:3px}
.dmid{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.via{font-size:13.5px;color:var(--muted);font-weight:600}
.dl{font-size:14.5px;font-weight:800;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.dl small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.rt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.rt .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800}
.rt .sub{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}

.plate{display:inline-flex;align-items:baseline;gap:1px;background:var(--grad);color:var(--on-grad);border-radius:12px;padding:6px 12px 5px;font-family:var(--f-num);font-weight:700;font-size:22px;line-height:1;box-shadow:var(--shadow-sm);white-space:nowrap}
.plate small{font-family:var(--f-body);font-size:.6em;font-weight:800}
.plate.sm{font-size:14.5px;padding:5px 9px 4px;border-radius:9px;box-shadow:none}
.kind{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:900;white-space:nowrap;line-height:1.4}
.k-fast{background:var(--ok-soft);color:var(--ok)}
.k-slow{background:var(--warn-soft);color:var(--warn)}
.k-sea{background:var(--blue-soft);color:var(--blue)}
.k-live{background:var(--ok-soft);color:var(--ok)}
.k-live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
.k-tt{background:var(--surface-2);color:var(--muted)}
@keyframes blink{50%{opacity:.25}}

/* bar */
.bar{display:flex;align-items:center;gap:12px;padding-top:4px}
.iconbtn{appearance:none;border:0;width:46px;height:46px;border-radius:15px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;flex:none}
.iconbtn svg{width:23px;height:23px}
.bar h1{margin:0;font-size:var(--t1);font-weight:900;letter-spacing:-.02em;line-height:1.2}
.bar p{margin:0;font-size:13.5px;color:var(--muted);font-weight:600}

/* pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px -8px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{appearance:none;border:0;flex:none;min-height:48px;padding:8px 15px;border-radius:17px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:16px;font-weight:900;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.2;transition:transform .18s var(--ease),background .25s}
.pill small{font-weight:700;color:var(--muted);font-size:12px}
.pill[aria-pressed="true"]{background:var(--grad);color:var(--on-grad)}
.pill[aria-pressed="true"] small{color:var(--on-grad-dim)}

/* location */
.loc{display:flex;flex-direction:column;gap:6px}
.loc-lab{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.loc-lab svg{width:18px;height:18px;color:var(--blue);flex:none}
.loc-name{font-size:calc(var(--t1) + 1px);font-weight:900;letter-spacing:-.02em;line-height:1.2}
.loc-meta{font-size:15px;color:var(--muted);font-weight:600}
.loc-act{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:11px 16px;border-radius:16px;font-size:16px;font-weight:800;text-decoration:none;color:var(--link);background:var(--blue-soft);text-align:center;transition:transform .18s var(--ease),background .25s}
.m-easy .btn{min-height:54px;font-size:17px}
.btn svg{width:20px;height:20px;flex:none}
.btn--pri{background:var(--grad);color:var(--on-grad)!important;box-shadow:var(--shadow-sm)}
.btn--on{background:var(--late-soft);color:var(--late)}
.btn--ghost{background:var(--surface-2);color:var(--ink)}
.btn--big{width:100%;min-height:60px;font-size:19px;border-radius:20px}
.locating{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:800}
.pulse{width:18px;height:18px;border-radius:50%;background:var(--blue);animation:pulse 1.4s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 50%,transparent)}70%,100%{box-shadow:0 0 0 16px transparent}}
.places{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.place{appearance:none;border:0;padding:10px 14px;border-radius:14px;background:var(--surface-2);font-size:15px;font-weight:800;min-height:44px}
details.pick summary{font-size:16px;font-weight:900;list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.pick summary::-webkit-details-marker{display:none}
details.pick summary::after{content:"펼치기";font-size:13.5px;color:var(--link);font-weight:800}
details.pick[open] summary::after{content:"접기"}
.pick .half{font-size:13.5px;font-weight:800;color:var(--muted);margin:16px 2px 0}

/* main bus card */
.main{display:flex;flex-direction:column;gap:14px}
.main-top{display:flex;flex-direction:column;align-items:center;gap:14px}
.m-normal .main-top{display:grid;grid-template-columns:var(--ring) minmax(0,1fr);align-items:center;gap:16px}
.ring{position:relative;width:var(--ring);height:var(--ring);max-width:100%;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--track)}
.ring .val{transition:stroke-dashoffset 1s linear,stroke .4s}
.ring-in{position:absolute;inset:12.5%;border-radius:50%;background:var(--surface);box-shadow:var(--inset),0 10px 22px -10px rgba(34,62,128,.30);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6px}
.ring-big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.ring-big .n{font-size:var(--rn)}
.ring-big .u{font-family:var(--f-body);font-size:calc(var(--rn) * .4);font-weight:800;margin:0 2px 0 1px}
.ring-big .w{font-family:var(--f-body);font-size:calc(var(--rn) * .75);font-weight:900}
.ring-sm{font-size:13.5px;font-weight:700;color:var(--muted);margin-top:5px}
.m-normal .ring-sm{font-size:11.5px;margin-top:3px}
.info{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;min-width:0}
.m-normal .info{align-items:stretch}
.st{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:900;font-size:16px;background:var(--s-soft);color:var(--s);align-self:center;transition:background .3s,color .3s}
.m-easy .st{font-size:18px}
.m-normal .st{align-self:flex-start;font-size:14px;padding:6px 12px}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.s-ok{--s:var(--ok);--s-soft:var(--ok-soft)}
.s-warn{--s:var(--warn);--s-soft:var(--warn-soft)}
.s-late{--s:var(--late);--s-soft:var(--late-soft)}
.s-done{--s:var(--muted);--s-soft:var(--surface-2)}
.srcwrap{align-self:center}
.m-normal .srcwrap{align-self:flex-start}
.facts{width:100%;display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center;background:var(--surface-2);border-radius:18px;padding:2px 16px;margin:0}
.m-normal .facts{background:none;padding:0;border-radius:0}
.facts dt{font-size:14px;font-weight:700;color:var(--muted);padding:12px 0}
.facts dd{margin:0;justify-self:end;text-align:right;font-size:19px;font-weight:900;padding:12px 0;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.m-normal .facts dt{padding:7px 0;font-size:13px}
.m-normal .facts dd{padding:7px 0;font-size:16px}
.facts dt:not(:first-of-type),.facts dt:not(:first-of-type)+dd{border-top:1px solid var(--line)}
.facts .num{font-weight:600;font-size:1.1em}
.facts dd small{font-size:13px;font-weight:700;color:var(--muted)}
.facts .pk{display:flex;align-items:center;gap:6px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.alnote{font-size:13px;color:var(--muted);font-weight:600;text-align:center;margin:-4px 0 0}

/* timeline */
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 16px 36px}
.m-normal .tl li{padding-bottom:12px}
.tl li::before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:3px;border-radius:3px;background:var(--blue-line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:2px;top:4px;width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.tl li.on .dot{background:var(--grad);border:0;box-shadow:0 0 0 5px var(--blue-soft)}
.tl li.end .dot{background:var(--blue)}
.tl li.out{opacity:.5}
.tl li.out .dot{border-color:var(--blue-line)}
.tl li.out::before{background:var(--line)}
.tl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.m-normal .tl .nm{font-size:15.5px}
.tl .tm{font-size:13.5px;color:var(--muted);font-weight:600}
.tl li.gap .dot{border:0;background:none}
.tl li.gap .dot::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:16px;background:radial-gradient(circle,var(--blue) 2px,transparent 2.5px) 0 0/4px 6px repeat-y}
.tl li.gap button{appearance:none;border:0;background:var(--blue-soft);color:var(--link);font-weight:800;font-size:14px;padding:7px 12px;border-radius:12px}
.busic{position:absolute;left:-3px;top:-2px;width:29px;height:29px;border-radius:10px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(47,98,245,.6);animation:bob 2.4s ease-in-out infinite;z-index:1}
.busic svg{width:18px;height:18px}
@keyframes bob{50%{transform:translateY(-2px)}}
.tl li.bus .nm{font-size:14.5px;color:var(--link)}
.tl.full li{animation:fadein .35s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.buspos{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:700;margin-bottom:10px}
.buspos svg{width:20px;height:20px;color:var(--blue);flex:none}

.note{border-radius:18px;padding:13px 15px;background:var(--warn-soft);color:var(--note-ink);font-size:14.5px;font-weight:600;line-height:1.5}
.note b{font-weight:900}
.empty{text-align:center;padding:18px 6px;color:var(--muted);font-weight:600}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:900;margin-bottom:4px}

/* timetable */
.tt-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tt-t{font-size:18px;font-weight:900;line-height:1.25}
.tt-s{font-size:13.5px;color:var(--muted);font-weight:600}
.half{font-size:13.5px;font-weight:800;color:var(--muted);margin:14px 2px 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.chip{border-radius:14px;background:var(--surface-2);padding:9px 4px 8px;text-align:center;font-size:18px;font-weight:600;line-height:1.15}
.chip small{display:block;font-family:var(--f-body);font-size:11px;font-weight:800;color:var(--link);margin-top:2px}
.chip.past{color:var(--muted);opacity:.45;text-decoration:line-through}
.chip.nxt{background:var(--grad);color:var(--on-grad);box-shadow:var(--shadow-sm)}
.chip.nxt small{color:var(--on-grad)}

/* settings */
.set{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set .card-h+.set-row{border-top:0}
.set-row .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row .l b{font-size:16px;font-weight:800}
.set-row .l span{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;flex:none;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:0;background:none;padding:8px 12px;border-radius:11px;font-size:14px;font-weight:800;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.field{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:15px;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--blue)}
.stack{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);border-radius:12px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;margin:0;color:var(--ink)}

/* toast, alarm bar, sheet */
.toast{position:fixed;left:0;right:0;top:0;z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
.toast-in{pointer-events:auto;max-width:468px;margin:0 auto;background:var(--toast);color:var(--on-toast);border-radius:22px;padding:15px 18px;box-shadow:0 20px 40px -12px rgba(0,0,0,.45);display:flex;gap:14px;align-items:center;animation:drop .35s var(--ease)}
.toast-in svg{width:28px;height:28px;flex:none;color:#F5B400}
.toast-in b{display:block;font-size:18px;font-weight:900;line-height:1.3}
.toast-in span{font-size:14px;opacity:.8;font-weight:600}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}
.abar{pointer-events:auto;max-width:468px;margin:0 auto 22px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;animation:drop .3s var(--ease)}
.abar svg{width:22px;height:22px;color:var(--late);flex:none;animation:ring 2s infinite}
@keyframes ring{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(14deg)}90%{transform:rotate(-12deg)}95%{transform:rotate(8deg)}}
.abar .t{flex:1;min-width:0;font-size:14.5px;font-weight:800;line-height:1.3}
.abar .t span{display:block;color:var(--link);font-variant-numeric:tabular-nums}
.abar button{appearance:none;border:0;background:var(--late-soft);color:var(--late);font-weight:900;font-size:14.5px;border-radius:12px;padding:10px 14px;flex:none}
.tabbar-in{pointer-events:auto;max-width:468px;margin:0 auto;height:72px;border-radius:26px;background:var(--grad);box-shadow:0 18px 30px -12px rgba(47,98,245,.55);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--on-grad-dim);font-size:11.5px;font-weight:800;padding:8px 0;transition:color .2s;white-space:nowrap}
.tab svg{width:23px;height:23px;transition:transform .25s var(--ease)}
.tab[aria-current="page"]{color:var(--on-grad)}
.tab[aria-current="page"] svg{transform:translateY(-2px)}
.tab--c .cbtn{width:58px;height:58px;border-radius:50%;background:var(--surface);color:var(--blue);display:grid;place-items:center;margin-top:-32px;box-shadow:0 10px 20px -6px rgba(0,0,0,.4),0 0 0 6px rgba(255,255,255,.3)}
.tab--c .cbtn svg{width:27px;height:27px}
.tab--c{color:var(--on-grad)}
.m-easy .tab{font-size:12px}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .25s ease}
.sheet-in{width:100%;max-width:468px;background:var(--surface);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;animation:up .35s var(--ease)}
.sheet h2{margin:0;font-size:23px;font-weight:900}
.choice{appearance:none;border:2px solid var(--line);background:var(--surface-2);border-radius:20px;padding:16px;text-align:left;display:flex;gap:14px;align-items:center}
.choice .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.choice .ic svg{width:26px;height:26px}
.choice b{display:block;font-size:18px;font-weight:900}
.choice span{font-size:14px;color:var(--muted);font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px)}}

@media (max-width:360px){.tile-t{font-size:19px}body.m-easy{--ring:204px;--rn:36px}.qa b{font-size:14px}.tab{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* 노선도 — 시간표(예상 위치) 또는 실시간 정류장 목록·버스 위치 */
function routeBlock(o){
  const r = R(o.rid), lv = LIVE.on && LIVE.map[o.rid] && o.liveFrom != null ? LIVE.map[o.rid] : null;
  let items, from, to, busIdx = [], busBetween = -1, busNote = "";
  if (lv){
    items = lv.stops.map((s, i) => ({ name:s.nodenm, i }));
    from = o.liveFrom; to = o.liveTo;
    const b = liveBuses(o.rid);
    if (b && b.list.length){
      b.list.forEach(x => { const k = lv.stops.findIndex(s => s.nodeord === x.nodeord); if (k >= 0) busIdx.push(k); });
      const ahead = busIdx.filter(k => k <= from).sort((a, c) => c - a)[0];
      busNote = ahead != null ? "버스가 " + lv.stops[ahead].nodenm + "에 있어요 · " + (from - ahead === 0 ? "곧 도착" : (from - ahead) + "정거장 전") + " (실시간)" : "타는 정류장 쪽으로 오는 버스가 아직 없어요";
    } else busNote = b ? "지금 운행 중인 버스가 없어요" : "버스 위치를 불러오는 중이에요";
  } else {
    items = r.seq.map((s, i) => ({ name:STOPS[s[0]].name, i, t:o.homeMin + s[1] }));
    from = o.fromI; to = o.toI;
    const now = msToMin(Date.now()), first = items[0].t, last = items[items.length - 1].t;
    if (now < first - 0.5) busNote = "버스 출발 전 · " + items[0].name + "에서 " + tl(first) + " 출발 예정";
    else if (now > last + 0.5) busNote = "이 버스는 운행을 마쳤어요";
    else {
      for (let k = 0; k < items.length - 1; k++) if (now >= items[k].t && now < items[k + 1].t){ busBetween = k; break; }
      if (busBetween >= 0) busNote = "버스가 " + items[busBetween].name + " → " + items[busBetween + 1].name + " 사이쯤 있어요 (예상)";
    }
  }
  const full = S.tlOpen, inSeg = k => k >= from && k <= to;
  let show = full ? items.map(x => x.i) : items.filter(x => inSeg(x.i)).map(x => x.i);
  let gap = null;
  if (!full && show.length > 7){ gap = { n:show.length - 6, at:3, hidden:show.slice(3, -3) }; show = show.slice(0, 3).concat(show.slice(-3)); }
  const busHere = k => busIdx.includes(k);
  let h = '<section class="card"><div class="card-h"><h2>' + (o.title || '가는 길') + '</h2><button class="lnk" data-act="tl">' + (full ? '접기' : '전체 노선 보기') + '</button></div>' +
    (busNote ? '<div class="buspos">' + svg("bus") + '<span>' + esc(busNote) + '</span></div>' : '') + '<ol class="tl' + (full ? ' full' : '') + '">';
  show.forEach((k, n) => {
    if (gap && n === gap.at){
      const hasBus = gap.hidden.some(i => busHere(i) || i === busBetween);
      h += '<li class="gap"><span class="dot"></span><button data-act="tl">' + (hasBus ? '버스 있음 · ' : '') + '정류장 ' + gap.n + '곳 더보기</button></li>';
    }
    const x = items[k], first = k === from, last = k === to, out = full && !inSeg(k);
    const tm = lv ? (first ? (o.firstTxt || '') : last ? (o.lastTxt || '') : '') : (first ? tl(x.t) + ' 출발' : '약 ' + tl(x.t) + (last ? ' 도착' : ''));
    h += '<li class="' + (first ? 'on' : last ? 'end' : '') + (out ? ' out' : '') + '" style="animation-delay:' + Math.min(n * 18, 400) + 'ms">' +
      (busHere(k) ? '<span class="busic">' + svg("bus", 2.2) + '</span>' : '<span class="dot"></span>') +
      '<div class="nm">' + esc(x.name) + (first ? ' <span class="kind k-sea">타는 곳</span>' : '') + (last ? ' <span class="kind k-fast">내리는 곳</span>' : '') + '</div>' +
      (tm ? '<div class="tm">' + tm + '</div>' : '') + '</li>';
    if (k === busBetween && (full || (inSeg(k) && inSeg(k + 1) && show.includes(k + 1)))){
      h += '<li class="bus"><span class="busic">' + svg("bus", 2.2) + '</span><div class="nm">버스가 지금 여기쯤 와요 (예상)</div></li>';
    }
  });
  return h + '</ol></section>';
}

/* ---------- 정류장 보드 (카카오맵 정류장 화면처럼) ---------- */
const DIRS = { r230:"탑마트 · 사천터미널 방향", r2301:"푸르지오 돌아서 사천 방향", r111e:"사천 방향 (돌아서 감)", r111s:"삼천포 방향" };
const VIEW_OF = id => id === "r111s" ? "sam" : "eup";
function liveGroups(nodeids){
  const g = {};
  nodeids.forEach(n => {
    if (NEED) NEED.nodes.add(n);
    const a = LIVE.arr[n]; if (!fresh(a)) return;
    a.list.forEach(x => { (g[x.routeid] = g[x.routeid] || { no:x.routeno, etas:[] }).etas.push({ ms:a.at + x.arrtime * 1000, prev:x.arrprevstationcnt }); });
  });

}
function sbRow(o){

function sbCard(title, sub, liveRows, ttRows){
  let h = '<section class="card"><div class="sb-h"><div><h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p></div>' +
    (LIVE.on ? '<button class="iconbtn sm' + (LIVE.busy ? ' spin' : '') + '" data-act="refresh" aria-label="새로고침">' + svg("re", 2.4) + '</button>' : '') + '</div>';

function homeBoard(){
  const nodes = [...new Set(ROUTES.map(r => liveNode(r.id)).filter(Boolean).map(n => n.s.nodeid))];
  const groups = liveGroups(nodes), used = new Set();
  const liveRows = [], ttRows = [];
  for (const r of ROUTES){
    const L = LIVE.on && LIVE.map[r.id], g = L && groups[String(L.routeid)];
    const row = { act:"go", v:VIEW_OF(r.id), sel:r.id, no:r.no, dir:DIRS[r.id], runs:runsAt(r, homeIdx(r), 2) };
    if (g && g.etas.length){ used.add(String(L.routeid)); liveRows.push([g.etas[0].ms, sbRow(Object.assign(row, { live:g.etas }))]); }
    else ttRows.push([row.runs[0] ? row.runs[0].depMs : 9e15, sbRow(row)]);
  }
  Object.entries(groups).forEach(([rid, g]) => { if (!used.has(rid) && g.etas.length) liveRows.push([g.etas[0].ms, sbRow({ act:"refresh", v:"", no:g.no, dir:"이 정류장을 지나는 다른 버스", live:g.etas })]); });
  const n0 = LIVE.on && nodes.length ? Object.values(LIVE.map).map(L => L.stops[L.homeI]).find(Boolean) : null;
  const sub = (n0 && n0.nodeno ? n0.nodeno : STOPS.home.no) + " · " + STOPS.home.dir;
  return sbCard(STOPS.home.name, sub, liveRows.sort((a, b) => a[0] - b[0]).map(x => x[1]), ttRows.sort((a, b) => a[0] - b[0]).map(x => x[1]));
}

    '<div class="loc-meta">여기서 약 ' + fmtDist(st.d) + ' · 걸어서 ' + walk + '분쯤</div>' +
    '<div class="loc-act"><button class="btn btn--pri" data-act="route" data-url="' + esc(routeUrl(p, st.name + " 정류장", st.lat, st.lng)) + '">' + svg("walk") + '정류장 길찾기</button><button class="btn" data-act="locate">' + svg("re") + '다시 조회</button></div></section>';
  if (opts.length > 1) o += '<div class="pills" role="group">' + opts.map(x => '<button class="pill" data-act="homesel" data-v="' + x.r.id + '" aria-pressed="' + (x === sel) + '">' + x.r.no + '번<small>' + x.label + '</small></button>').join("") + '</div>';
  const run = sel.runs[0], lv = useLive ? liveArrival(sel.r.id, ln) : null;
  if (run){
    const arrMin = lv && lv.etaMs ? msToMin(lv.etaMs) + sel.ride : run.homeMin;
    o += busCard({ run, live:lv, walk, label:sel.label, k:sel.k, title:"집 가는 버스", where:"걸어서 " + walk + "분", stopName:st.name,
      arrive:'<span>' + STOPS.home.name + '</span><small>약 ' + tl(arrMin) + ' 도착 · 버스로 ' + sel.ride + '분</small>' });
  }
  {
    const liveRows = [], ttRows = [];
    for (const x of opts){
      const xl = liveNode(x.r.id, p), xok = xl && xl.d < 1500;
      const g = xok ? liveGroups([xl.s.nodeid])[String(xl.L.routeid)] : null;
      const nm = xok ? xl.s.nodenm : STOPS[x.stop].name, dd = xok ? xl.d : x.d;
      const row = { act:"homesel", v:x.r.id, no:x.r.no, kind:kindTag(x.label, x.k), dir:nm + " 정류장 · " + fmtDist(dd) + " · 집까지 " + x.ride + "분", runs:x.runs };
      if (g && g.etas.length) liveRows.push([g.etas[0].ms, sbRow(Object.assign(row, { live:g.etas }))]);
      else ttRows.push([x.runs[0] ? x.runs[0].depMs : 9e15, sbRow(row)]);
    }
    o += sbCard("집 가는 버스 한눈에", "가까운 정류장 기준 · 눌러서 바꾸기", liveRows.sort((a, b) => a[0] - b[0]).map(v => v[1]), ttRows.sort((a, b) => a[0] - b[0]).map(v => v[1]));
  }
  if (run){
    const lvm = LIVE.on && LIVE.map[sel.r.id];
    o += routeBlock({ rid:sel.r.id, fromI:sel.idx, toI:homeIdx(sel.r), homeMin:run.homeMin, liveFrom: lvm && useLive ? ln.i : null, liveTo: lvm ? lvm.homeI : null, title:"버스 타고 가는 길",
      firstTxt: lv && lv.etaMs ? '실시간 ' + tl(msToMin(lv.etaMs)) + ' 도착' : '', lastTxt:'집 앞' });
  }
  if (sel.runs.length > 1){
    o += '<section class="card"><div class="card-h"><h2>그 다음 ' + esc(sel.r.no) + '번</h2><span>' + esc(STOPS[sel.stop].name) + ' 시간표</span></div><ul class="deps">';
    for (const x of sel.runs.slice(1, 4)) o += '<li><div class="row static"><span class="dt num"><small>' + (x.depMin >= 1440 ? "내일 " : "") + ampm(x.depMin) + '</small>' + hhmm(x.depMin) + '</span><span class="via">집 약 ' + tl(x.homeMin) + '</span><span class="dl">' + cd(x.depMs) + '</span></div></li>';
    o += '</ul></section>';
  }
  return o + pickCard(false);
}

function render(animate){
  lastMin = nowMin();
  NEED = { nodes:new Set(), routes:new Set() };
  const v = S.view;
  let html;
  try {
    html = v === "eup" ? viewEup() : v === "sam" ? viewSam() : v === "gohome" ? viewHome() : v === "times" ? viewTimes() : v === "alerts" ? viewAlerts() : v === "settings" ? viewSettings() : viewMain();
  } catch (e) { html = '<section class="card empty"><b>화면을 그리다 문제가 생겼어요</b>' + esc(e.message) + '</section>'; }
  $main.innerHTML = html;
  if (animate){ $main.classList.remove("enter"); void $main.offsetWidth; $main.classList.add("enter"); }
  renderTabs(); alarmBar();
  if (LIVE.on && !LIVE.busy && Date.now() - LIVE.failAt > 20000 && ([...NEED.nodes].some(n => !fresh(LIVE.arr[n])) || [...NEED.routes].some(r => !fresh(LIVE.bus[r])))){
    clearTimeout(LIVE.t); LIVE.t = setTimeout(() => { lastLive = Date.now(); liveRefresh(); }, 80);
  }

  const gv = document.getElementById("gvoice");

  const gk = document.getElementById("gkey");
  if (gk) gk.onchange = () => { SET.gKey = gk.value.trim(); saveSet(); aiErr = ""; speak("AI 목소리가 연결됐어요.", true); };
  const vs = document.getElementById("voice");
  if (vs) vs.onchange = () => { SET.voice = vs.value; saveSet(); speak("이 목소리로 알려드릴게요.", true); };
}
let lastLive = 0;
function tick(){
  if (nowMin() !== lastMin){ render(); return; }
  const now = Date.now();
  document.querySelectorAll("[data-cd]").forEach(el => { el.innerHTML = fmtLeft(+el.dataset.cd - now, el.dataset.fmt); });
  document.querySelectorAll("[data-ring]").forEach(el => {
    const C = 2 * Math.PI * 95, f = Math.min(Math.max(+el.dataset.ring - now, 0), 3600000) / 3600000;
    el.setAttribute("stroke-dashoffset", (C * (1 - f)).toFixed(1));
  });
  checkAlarm();
  if (LIVE.on && now - lastLive > 25000 && ["main", "eup", "sam", "gohome", "alerts"].includes(S.view)){ lastLive = now; liveRefresh(); }
}
const VIEWS = ["main", "eup", "sam", "gohome", "times", "alerts", "settings"];
function resetHome(){ S.pos = null; S.homeSel = null; S.locErr = false; S.locating = false; }
function nav(v, push){
  v = VIEWS.includes(v) ? v : "main";
  if (v === S.view && push !== false){ window.scrollTo({ top:0, behavior:"smooth" }); return; }
  if (S.view === "gohome" && v !== "gohome") resetHome();
  stopSpeak();
  S.view = v; S.tlOpen = false;
  if (push !== false){ try { history.pushState({ v }, "", "#" + v); depth++; } catch (e) {} }
  render(true); window.scrollTo(0, 0);
  lastLive = 0;
  if (v === "gohome" && !S.pos && !S.locating) locate();
}
async function locate(){
  S.locating = true; S.locErr = false; S.homeSel = null; render();
  const done = (pos, err) => { S.locating = false; if (pos){ S.pos = { lat:pos.lat, lng:pos.lng, src:"gps" }; S.locErr = false; } else S.locErr = err || true; render(true); lastLive = 0; };
  if (NATIVE && plug("Geolocation")){
    const G = plug("Geolocation");
    try {
      let p = await G.checkPermissions();
      if (p.location !== "granted") p = await G.requestPermissions();
      if (p.location === "denied") return done(null, "위치 권한이 꺼져 있어요. 폰 설정 → 애플리케이션 → 버스친구 → 권한에서 위치를 허용해 주세요.");
      const r = await G.getCurrentPosition({ enableHighAccuracy:true, timeout:12000, maximumAge:20000 });
      return done({ lat:r.coords.latitude, lng:r.coords.longitude });
    } catch (e) { return done(null, "위치를 못 찾았어요. GPS를 켜고 다시 눌러주세요."); }
  }
  if (!("geolocation" in navigator)) return done(null);
  let fin = false;
  const timer = setTimeout(() => { if (!fin){ fin = true; done(null, "위치를 찾는 데 시간이 너무 걸려요. GPS를 켜고 다시 눌러주세요."); } }, 13000);
  try {
    navigator.geolocation.getCurrentPosition(pos => { if (fin) return; fin = true; clearTimeout(timer); done({ lat:pos.coords.latitude, lng:pos.coords.longitude }); },
      err => { if (fin) return; fin = true; clearTimeout(timer); done(null, err && err.code === 1 ? "위치 사용이 막혀 있어요. 위치를 허용하거나 아래에서 지금 계신 곳을 골라주세요." : null); },
      { enableHighAccuracy:true, timeout:12000, maximumAge:20000 });
  } catch (e) { fin = true; clearTimeout(timer); done(null); }
}
function openExternal(url){
  S.extNav = true;
  if (NATIVE){ window.location.href = url; return; }
  const w = window.open(url, "_blank", "noopener");
  if (!w){ const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
}
window.addEventListener("popstate", e => {
  depth = Math.max(0, depth - 1);
  const v = VIEWS.includes(e.state && e.state.v) ? e.state.v : "main";
  if (S.view === "gohome" && v !== "gohome") resetHome();
  S.view = v; S.tlOpen = false; render(true);
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "go"){ if (el.dataset.sel && v === "eup") S.eupSel = el.dataset.sel; nav(v); }
  else if (a === "back"){ if (depth > 0){ try { history.back(); return; } catch (err) {} } nav("main", false); }
  else if (a === "eupsel"){ S.eupSel = v; S.tlOpen = false; render(true); window.scrollTo({ top:0, behavior:"smooth" }); }
  else if (a === "homesel"){ S.homeSel = v; S.tlOpen = false; render(); }
  else if (a === "locate") locate();
  else if (a === "refresh"){ if (LIVE.on){ lastLive = Date.now(); liveRefresh(); render(); } }
  else if (a === "place"){ const p = PLACES[+v]; S.pos = { lat:p.lat, lng:p.lng, src:"pick", name:p.name }; S.homeSel = null; S.locErr = false; render(true); window.scrollTo(0, 0); }
  else if (a === "stopplace"){ const s = STOPS[v]; S.pos = { lat:s.lat, lng:s.lng, src:"pick", name:s.name + " 정류장" }; S.homeSel = null; S.locErr = false; render(true); window.scrollTo(0, 0); }
  else if (a === "route") openExternal(el.dataset.url);
  else if (a === "tl"){ S.tlOpen = !S.tlOpen; render(); }
  else if (a === "speak") speak(S.speech, true);
  else if (a === "alarm") toggleAlarm(el.dataset);
  else if (a === "alarmoff"){ clearAlarm("알림을 껐어요"); render(); }
  else if (a === "toastclose") document.getElementById("toast").hidden = true;
  else if (a === "tt"){ S.tt = v; render(); }
  else if (a === "set"){ const k = el.dataset.k; SET[k] = k === "homeWalk" ? +v : v; saveSet(); applyLook(); render(); }
  else if (a === "pickmode"){ SET.mode = v; saveSet(); applyLook(); onboarding(); render(true); }
  else if (a === "voicetest"){ const gk2 = document.getElementById("gkey"); if (gk2){ SET.gKey = gk2.value.trim(); saveSet(); } speak("230번 버스가 10분 뒤에 와요. 삼정그린코아 정류장이에요.", true); }
  else if (a === "chimetest") chime(true);
  else if (a === "testalert"){
    buzz(); chime(); toast("230번 버스가 10분 뒤에 와요", "알림 미리 듣기");
    setTimeout(() => speak("230번 버스가 10분 뒤에 와요. 삼정그린코아 정류장이에요."), SET.sound === "both" ? 900 : 0);
    if (NATIVE && LN()) nativePrep().then(() => LN().schedule({ notifications:[{ id:9, title:"알림 테스트", body:"이렇게 폰 알림이 와요", channelId:"bus-alert", schedule:{ at:new Date(Date.now() + 4000), allowWhileIdle:true } }] })).catch(() => {});
  }
  else if (a === "exactset"){ const ln = LN(); if (ln && ln.changeExactNotificationSetting) ln.changeExactNotificationSetting().catch(() => {}); }
  else if (a === "livesave"){
    SET.tagoKey = (document.getElementById("tagokey").value || "").trim(); SET.proxy = (document.getElementById("proxy").value || "").trim(); SET.liveOff = false; saveSet();
    S.liveLog = []; LIVE.err = ""; toast("실시간 버스 연결 중…");
    liveInit(true).then(ok => { toast(ok ? "실시간 버스가 연결됐어요" : "연결 실패", ok ? "" : LIVE.err); lastLive = 0; render(); });
    render();
  }
  else if (a === "liveoff"){ SET.tagoKey = ""; SET.proxy = ""; SET.liveOff = true; saveSet(); LIVE.on = false; LIVE.map = {}; store.set("busapp.live", null); render(); }
});
function onHide(){ S.hiddenAt = Date.now(); }
function onShow(){
  if (S.hiddenAt && !S.extNav && Date.now() - S.hiddenAt > 60000 && S.view === "gohome") resetHome();
  S.extNav = false; S.hiddenAt = 0;
  render(); if (S.alarm) wakeOn(); lastLive = 0;
}
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
if (NATIVE && plug("App")){ try { plug("App").addListener("appStateChange", st => { if (st.isActive) onShow(); else onHide(); }); } catch (e) {} }
if (window.BUS_HOSTED && !NATIVE && "serviceWorker" in navigator){ try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }

/* 시작 */
(function init(){
  const saved = store.get("busapp.alarm", null);
  if (saved && saved.ms > Date.now() - 60000) S.alarm = Object.assign(saved, { fired:new Set(saved.fired || []) });
  const h0 = (location.hash || "").slice(1);
  S.view = VIEWS.includes(h0) ? h0 : "main";
  applyLook(); render(true); onboarding();
  loadVoices().then(() => { if (S.view === "settings") render(); });
  if (S.view === "gohome") locate();
  if (tagoKey() || SET.proxy) liveInit(false).then(() => { lastLive = 0; render(); });
  setInterval(tick, 1000);
})();
</script>
</body></html>
